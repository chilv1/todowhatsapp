<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Premium Todo List App — Quản lý công việc cá nhân hiệu quả với giao diện hiện đại" />
  <title>Todo App — Premium Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/index.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
  <!-- ===== Background Decoration ===== -->
  <div class="bg-decoration" aria-hidden="true">
    <div class="bg-orb bg-orb--1"></div>
    <div class="bg-orb bg-orb--2"></div>
    <div class="bg-orb bg-orb--3"></div>
  </div>

  <div class="app-container">
    <!-- ===== Header ===== -->
    <header class="app-header" id="app-header">
      <div class="header-left">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          <h1 class="logo-text">Todo<span>App</span></h1>
        </div>
      </div>
      <div class="header-right">
        <button class="btn-icon" id="btn-stats" title="Statistics" aria-label="View statistics">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        </button>
        <button class="btn-icon" id="btn-theme" title="Toggle theme" aria-label="Toggle dark/light theme">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>
    </header>

    <!-- ===== Main Content ===== -->
    <main class="app-main">
      <!-- Input Area -->
      <section class="input-section glass-card" id="input-section">
        <div class="input-row">
          <input type="text" class="task-input" id="task-input" placeholder="What needs to be done?" autocomplete="off" aria-label="New task" />
          <button class="btn-add" id="btn-add" title="Add task" aria-label="Add new task">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
        <div class="input-options" id="input-options">
          <div class="option-group">
            <label class="option-label" for="priority-select">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
              Priority
            </label>
            <select id="priority-select" class="option-select">
              <option value="low">🟢 Low</option>
              <option value="medium" selected>🟡 Medium</option>
              <option value="high">🔴 High</option>
            </select>
          </div>
          <div class="option-group">
            <label class="option-label" for="due-date">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              Due
            </label>
            <input type="date" id="due-date" class="option-input" />
          </div>
          <div class="option-group">
            <label class="option-label" for="category-select">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
              Tag
            </label>
            <select id="category-select" class="option-select">
              <option value="personal">Personal</option>
              <option value="work">Work</option>
              <option value="study">Study</option>
              <option value="health">Health</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>
      </section>

      <!-- Search & Filter Bar -->
      <section class="filter-section" id="filter-section">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" class="search-input" id="search-input" placeholder="Search tasks..." aria-label="Search tasks" />
        </div>
        <div class="filter-tabs" id="filter-tabs" role="tablist">
          <button class="filter-tab active" data-filter="all" role="tab" aria-selected="true">All</button>
          <button class="filter-tab" data-filter="active" role="tab" aria-selected="false">Active</button>
          <button class="filter-tab" data-filter="completed" role="tab" aria-selected="false">Completed</button>
        </div>
      </section>

      <!-- Task List -->
      <section class="task-list-section" id="task-list-section">
        <ul class="task-list" id="task-list" role="list" aria-label="Task list"></ul>

        <!-- Empty State -->
        <div class="empty-state" id="empty-state" style="display:none;">
          <div class="empty-illustration">
            <svg viewBox="0 0 120 120" fill="none">
              <circle cx="60" cy="60" r="50" stroke="currentColor" stroke-width="1.5" opacity="0.15"/>
              <circle cx="60" cy="60" r="35" stroke="currentColor" stroke-width="1.5" opacity="0.1"/>
              <path d="M45 60l10 10 20-20" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
            </svg>
          </div>
          <p class="empty-title">No tasks yet</p>
          <p class="empty-subtitle">Add your first task above to get started!</p>
        </div>
      </section>

      <!-- Footer -->
      <footer class="app-footer glass-card" id="app-footer">
        <span class="task-count" id="task-count">0 items left</span>
        <div class="footer-actions">
          <button class="btn-text" id="btn-export" title="Export tasks">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Export
          </button>
          <button class="btn-text" id="btn-import" title="Import tasks">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Import
          </button>
          <input type="file" id="import-file" accept=".json" style="display:none" />
          <button class="btn-text btn-danger" id="btn-clear" title="Clear completed tasks">Clear done</button>
        </div>
      </footer>
    </main>
  </div>

  <!-- ===== Statistics Modal ===== -->
  <div class="modal-overlay" id="modal-stats" aria-hidden="true">
    <div class="modal glass-card" role="dialog" aria-label="Statistics">
      <div class="modal-header">
        <h2>📊 Statistics</h2>
        <button class="btn-icon btn-close-modal" id="btn-close-stats" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="stats-grid" id="stats-grid">
          <div class="stat-card">
            <div class="stat-number" id="stat-total">0</div>
            <div class="stat-label">Total Tasks</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="stat-completed">0</div>
            <div class="stat-label">Completed</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="stat-active">0</div>
            <div class="stat-label">Active</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="stat-overdue">0</div>
            <div class="stat-label">Overdue</div>
          </div>
        </div>
        <div class="stats-chart" id="stats-chart">
          <h3>Completion Rate</h3>
          <div class="progress-ring-container">
            <svg class="progress-ring" viewBox="0 0 120 120">
              <defs>
                <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#6C5CE7"/>
                  <stop offset="100%" stop-color="#55EFC4"/>
                </linearGradient>
              </defs>
              <circle class="progress-ring__bg" cx="60" cy="60" r="52" />
              <circle class="progress-ring__fill" id="progress-fill" cx="60" cy="60" r="52" />
            </svg>
            <div class="progress-ring__text" id="progress-text">0%</div>
          </div>
        </div>
        <div class="stats-breakdown">
          <h3>By Priority</h3>
          <div class="breakdown-bars" id="breakdown-bars"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Keyboard Shortcuts Toast ===== -->
  <div class="toast-container" id="toast-container"></div>

  <!-- ===== Scripts ===== -->
  <script src="js/utils.js?v=3"></script>
  <script src="js/store.js?v=3"></script>
  <script src="js/ui.js?v=3"></script>
  <script src="js/dragdrop.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
